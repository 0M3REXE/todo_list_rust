[package]
name = "practice"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
async-trait = "0.1.92"
axum = "0.8.9"
axum-login = "0.18.0"
base64 = "0.23.1"
dotenvy = "0.15"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
password-auth = "1.0.0"
rand = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "time"] }
time = "0.3.55"
tokio = { version = "1.52.4", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "fs", "compression-gzip", "set-header", "timeout", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

