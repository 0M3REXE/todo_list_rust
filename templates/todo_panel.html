<div id="todo-panel" class="todo-panel box">
    <form class="todo-add field" hx-post="/app/todos" hx-target="#todo-panel" hx-swap="outerHTML">
        <div class="control is-expanded">
            <label class="todo-label label is-sr-only" for="todo-text">Add a todo</label>
            <input
                id="todo-text"
                class="todo-input input"
                type="text"
                name="text"
                placeholder="What needs doing?"
                maxlength="280"
                autocomplete="off"
                required
            >
        </div>
        <div class="control">
            <button
                type="submit"
                class="todo-submit button is-primary is-fullwidth"
                hx-disabled-elt="this"
            >
                Add
            </button>
        </div>
    </form>
{% include "todo_list.html" %}
    <p class="todo-count has-text-grey is-size-7" aria-live="polite">{{ open_count }} open</p>
</div>
