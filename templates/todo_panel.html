<div id="todo-panel" class="todo-panel card">
    <div class="todo-search">
        <div class="min-w-0 flex-1">
            <input
                id="todo-search"
                class="input"
                type="search"
                name="search"
                placeholder="Search tasks…"
                autocomplete="off"
                aria-label="Search todos"
            >
        </div>
        <div class="shrink-0">
            <button
                type="button"
                class="btn btn--ghost btn--sm"
                onclick="document.getElementById('todo-search').value=''; filterTodos()"
                title="Clear search"
            >
                ✕
            </button>
        </div>
    </div>
    <form class="todo-add" hx-post="/app/todos" hx-target="#todo-panel" hx-swap="outerHTML">
        <div class="min-w-0 flex-1">
            <label class="todo-label sr-only" for="todo-text">Add a todo</label>
            <input
                id="todo-text"
                class="todo-input input"
                type="text"
                name="text"
                placeholder="What needs doing?"
                maxlength="280"
                autocomplete="off"
                required
            >
        </div>
        <div class="shrink-0">
            <button
                type="submit"
                class="todo-submit btn btn--primary btn--full"
                hx-disabled-elt="this"
            >
                Add
            </button>
        </div>
    </form>
{% include "todo_list.html" %}
    <p class="todo-count text-xs text-[var(--ink-muted)]" aria-live="polite">{{ open_count }} open</p>
</div>
