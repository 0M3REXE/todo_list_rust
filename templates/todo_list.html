<ul id="todo-list" class="todo-list">
{% for todo in todos %}
    <li class="todo-row{% if todo.done %} todo-row--done{% endif %}" data-text="{{ todo.text }}">
        <label class="checkbox">
            <input
                class="todo-toggle"
                type="checkbox"
                {% if todo.done %}checked{% endif %}
                hx-post="/app/todos/{{ todo.id }}/toggle"
                hx-target="#todo-list"
                hx-swap="outerHTML"
                aria-label="Mark {% if todo.done %}incomplete{% else %}complete{% endif %}: {{ todo.text }}"
            >
            <span class="is-sr-only">Mark as {% if todo.done %}not done{% else %}done{% endif %}</span>
        </label>
        <span class="todo-text">{{ todo.text }}</span>
        <button
            class="todo-delete button is-danger is-small"
            hx-post="/app/todos/{{ todo.id }}/delete"
            hx-target="#todo-list"
            hx-swap="outerHTML"
            hx-confirm="Delete this todo?"
            aria-label="Delete {{ todo.text }}"
        >
            Delete
        </button>
    </li>
{% else %}
    <li class="todo-empty">Nothing on the list. Type above and press Enter.</li>
{% endfor %}
</ul>
