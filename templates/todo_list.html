<ul id="todo-list" class="todo-list">
{% for todo in todos %}
    <li class="todo-row{% if todo.done %} todo-row--done{% endif %}">
        <input
            type="checkbox"
            class="todo-toggle"
            {% if todo.done %}checked{% endif %}
            hx-post="/todos/{{ todo.id }}/toggle"
            hx-target="#todo-list"
            hx-swap="outerHTML"
            aria-label="Mark {{ todo.text }} as {% if todo.done %}not done{% else %}done{% endif %}"
        >
        <span class="todo-text">{{ todo.text }}</span>
    </li>
{% else %}
    <li class="todo-empty">Nothing on the list. Type above and press Enter.</li>
{% endfor %}
</ul>
