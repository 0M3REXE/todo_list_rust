<ul id="todo-list" class="todo-list">
{% for todo in todos %}
    <li class="todo-row{% if todo.done %} todo-row--done{% endif %}">
        <label class="checkbox">
            <input
                class="todo-toggle"
                type="checkbox"
                {% if todo.done %}checked{% endif %}
                hx-post="/todos/{{ todo.id }}/toggle"
                hx-target="#todo-list"
                hx-swap="outerHTML"
            >
            <span class="is-sr-only">Mark as {% if todo.done %}not done{% else %}done{% endif %}</span>
        </label>
        <span class="todo-text">{{ todo.text }}</span>
    </li>
{% else %}
    <li class="todo-empty has-text-centered has-text-grey is-italic">Nothing on the list. Type above and press Enter.</li>
{% endfor %}
</ul>
