<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create an account · Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    >
    <link rel="stylesheet" href="/static/app.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d4a033">
    <script src="/static/password-toggle.js" defer></script>
    <script src="/static/theme-toggle.js" defer></script>
    <script src="/static/keyboard.js" defer></script>
</head>
<body class="page min-h-screen bg-[var(--paper)] text-[var(--ink)] antialiased">
    <a href="#main-content" class="skip-link">Skip to signup form</a>

    <header class="shell header">
        <div class="shell">
            <div class="header__actions">
                <div class="header__actions">
                    <div >
                        <a href="/" class="header__brand">Todo List</a>
                    </div>
                </div>
                <div class="header__actions">
                    <div >
                        <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                            <span class="theme-toggle-icon">🌙</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content" class="page__main">
        <div class="shell">
            <div >
                <div class="auth">
                    <h1 class="auth__title">Create an account</h1>

                    {% if let Some(message) = error %}
                    <div class="alert alert--danger" role="alert">{{ message }}</div>
                    {% endif %}

                    <form method="post" action="/signup">
                        <div class="field">
                            <label class="field__label" for="email">Email</label>
                            <div >
                                <input
                                    class="input"
                                    type="email"
                                    id="email"
                                    name="email"
                                    autocomplete="username"
                                    value="{{ email }}"
                                    required
                                    autofocus
                                >
                            </div>
                        </div>
                        <div class="field">
                            <label class="field__label" for="password">Password</label>
                            <div >
                                <input
                                    class="input"
                                    type="password"
                                    id="password"
                                    name="password"
                                    autocomplete="new-password"
                                    minlength="8"
                                    required
                                >
                                <p class="field__hint">At least 8 characters.</p>
                                <button
                                    class="input-group__toggle"
                                    type="button"
                                    data-password-toggle
                                    aria-pressed="false"
                                >Show</button>
                            </div>
                        </div>
                        <div class="field">
                            <label class="field__label" for="password_confirm">Confirm password</label>
                            <div >
                                <input
                                    class="input"
                                    type="password"
                                    id="password_confirm"
                                    name="password_confirm"
                                    autocomplete="new-password"
                                    required
                                >
                            </div>
                        </div>
                        <div class="field">
                            <div >
                                <button class="btn btn--primary btn--full" type="submit">
                                    Sign up
                                </button>
                            </div>
                        </div>
                    </form>

                    <p class="auth__footer mt-4">
                        <a href="/login">Already have an account? Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/service-worker.js');
      }
    </script>
</body>
</html>
