<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
    >
    <link rel="stylesheet" href="/static/vendor/bulma.min.css">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="has-gradient-page">
    <main class="section">
        <div class="container is-max-desktop">
            <div class="columns is-centered">
                <div class="column is-half-tablet is-one-third-desktop">
                    <div class="box has-text-centered">
                        {% if ok %}
                        <h1 class="title is-4">{{ title }}</h1>
                        <p class="mb-5">{{ detail }}</p>
                        <a class="button is-primary" href="/">Go to your list</a>
                        {% else %}
                        {# Deliberately the same shape as the success page: a
                           visibly different layout would make it easy to tell
                           a real failure from a generic refusal. #}
                        <h1 class="title is-4">{{ title }}</h1>
                        <p class="mb-5">{{ detail }}</p>
                        <a class="button" href="/login">Back to log in</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
