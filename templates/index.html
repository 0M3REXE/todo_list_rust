<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Todos · Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    >
    <link rel="stylesheet" href="/static/app.css">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/brand-mark.svg">
    <link rel="apple-touch-icon" href="/static/icons/icon-180x180.png">
    <meta name="theme-color" content="#d4a033">
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/theme-toggle.js" defer></script>
    <script src="/static/keyboard.js" defer></script>
</head>
<body class="page min-h-screen bg-[var(--paper)] text-[var(--ink)] antialiased">
    <a href="#main-content" class="skip-link">Skip to your tasks</a>

    <header class="shell">
        <div class="header">
            {% include "brand.html" %}
            <div class="header__actions">
                {% include "theme_toggle.html" %}
                <a class="btn btn--ghost btn--sm" href="/account/password">Account</a>
                <form method="post" action="/logout">
                    <button class="btn btn--ghost btn--sm" type="submit">Log out</button>
                </form>
            </div>
        </div>
    </header>

    <main id="main-content" class="page__main" aria-label="Todo list">
        <div class="shell">
            <div class="todo-header">
                <div>
                    <p class="todo-header__email">Your tasks · {{ email }}</p>
                    <h1 class="todo-header__title">Todos</h1>
                </div>
            </div>
            {% include "todo_panel.html" %}
        </div>
    </main>
</body>
</html>
