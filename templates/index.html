<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Todos · Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    >
    <link rel="stylesheet" href="/static/app.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#d4a033">
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/theme-toggle.js" defer></script>
    <script src="/static/keyboard.js" defer></script>
</head>
<body class="page min-h-screen bg-[var(--paper)] text-[var(--ink)] antialiased">
    <a href="#main-content" class="skip-link">Skip to your tasks</a>

    <header class="shell header">
        <div class="shell">
            <div class="header__actions">
                <div class="header__actions">
                    <div >
                        <a href="/" class="header__brand">Todo List</a>
                    </div>
                    <div >
                        <p class="todo-header__email">Your tasks · {{ email }}</p>
                        <h1 class="todo-header__title">Todos</h1>
                    </div>
                </div>
                <div class="header__actions">
                    <div >
                        <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                            <span class="theme-toggle-icon">🌙</span>
                        </button>
                    </div>
                    <div >
                        <form method="post" action="/logout">
                            <button class="btn btn--ghost btn--sm" type="submit">Log out</button>
                        </form>
                    </div>
                    <div >
                        <a class="btn btn--ghost btn--sm" href="/account/password">Account</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content" class="page__main" aria-label="Todo list">
        <div class="shell">
            {% include "todo_panel.html" %}
        </div>
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/service-worker.js');
      }
    </script>
</body>
</html>
