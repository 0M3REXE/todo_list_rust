<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Todos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
    >
    <link rel="stylesheet" href="/static/vendor/bulma.min.css">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body class="has-gradient-page">
    <main class="section">
        <div class="container is-max-desktop">
<header class="page__head has-gradient-sheen">
                <div class="level">
                    <div class="level-left">
                        <div>
                            <h1 class="title is-3 page__title">Todos</h1>
                            <p class="subtitle is-6 page__sub">
                                Signed in as <strong>{{ email }}</strong>
                            </p>
                        </div>
                    </div>
                    <div class="level-right">
                        {# Logout is a POST so another site cannot end this session
                           with an <img src="/logout">; a plain link would allow it. #}
                        <form method="post" action="/logout">
                            <button class="button is-small" type="submit">Log out</button>
                        </form>
                        <a class="button is-small" href="/account/password">Account</a>
                    </div>
                </div>
            </header>
{% include "todo_panel.html" %}
        </div>
    </main>
</body>
</html>
