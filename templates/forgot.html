<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Forgot your password?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
    >
    <link rel="stylesheet" href="/static/vendor/bulma.min.css">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="has-gradient-page">
    <main class="section">
        <div class="container is-max-desktop">
            <div class="columns is-centered">
                <div class="column is-half-tablet is-one-third-desktop">
                    <div class="box">
                        <h1 class="title is-4">Forgot your password?</h1>
                        <p class="subtitle is-6">
                            Enter the address on the account and we will send a link.
                        </p>

                        {% if let Some(message) = error %}
                        <div class="notification is-danger is-light" role="alert">{{ message }}</div>
                        {% endif %}

                        <form method="post" action="/forgot">
                            <div class="field">
                                <label class="label" for="email">Email</label>
                                <div class="control">
                                    <input
                                        class="input"
                                        type="email"
                                        id="email"
                                        name="email"
                                        autocomplete="username"
                                        required
                                        autofocus
                                    >
                                </div>
                            </div>
                            <div class="field">
                                <div class="control">
                                    <button class="button is-primary is-fullwidth" type="submit">
                                        Send reset link
                                    </button>
                                </div>
                            </div>
                        </form>

                        <p class="has-text-centered mt-4">
                            <a href="/login">Back to log in</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
